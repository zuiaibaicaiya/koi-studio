name: Build & Release macOS App

# 触发条件：
#   1. 推送 v* 标签 —— 自动构建并发布 GitHub Release
#   2. 手动触发 —— 可选是否创建 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建后创建 GitHub Release 并上传产物'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  # 模型缓存 key；更换模型后递增此值以触发重新下载
  MODELS_CACHE_KEY: 'koi-models-v1'

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # 参考 electron/electron 官方 macos-publish.yml：全部使用 macos-15 系列 runner
        # arm64 在 macos-15-xlarge (Apple Silicon) 上原生构建
        # x64   在 macos-15-xlarge (Apple Silicon) 上用 electron-builder --x64 打包
        #       Go 二进制利用 sherpa-onnx-go-macos 提供的双架构 fat dylib，
        #       通过 GOARCH=amd64 输出 x86_64 二进制，运行时 Rosetta 2 保证兼容
        # 部署目标统一为 macOS 15.0
        include:
          - arch: arm64
            os: macos-15-xlarge
            goarch: arm64
          - arch: x64
            os: macos-15-xlarge
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koi-server/go.mod
          cache-dependency-path: koi-server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: koi-ui/package-lock.json

      # ── 准备后端 extraResources：models ──────────────────────────
      # models 目录(~558MB)被 gitignore，从 k2-fsa 官方 Release 直接下载
      - name: Restore models cache
        id: models-cache
        uses: actions/cache@v5
        with:
          path: koi-server/models
          key: ${{ env.MODELS_CACHE_KEY }}

      - name: Download models from upstream
        if: steps.models-cache.outputs.cache-hit != 'true'
        working-directory: koi-server
        run: |
          set -e
          mkdir -p models/speaker

          # 1. ASR 模型: sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
          ASR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20.tar.bz2"
          echo "下载 ASR 模型..."
          curl -fSL --retry 3 -o /tmp/asr.tar.bz2 "$ASR_URL"
          tar -xjf /tmp/asr.tar.bz2 -C models/
          rm /tmp/asr.tar.bz2
          # hotwords.txt 为运行时热词文件，上游包不含则创建空文件
          touch "models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/hotwords.txt"

          # 2. Speaker 模型: 3dspeaker_speech_campplus_sv_zh-cn_16k-common
          SPK_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx"
          echo "下载 Speaker 模型..."
          curl -fSL --retry 3 -o "models/speaker/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx" "$SPK_URL"

          echo "模型目录大小："
          du -sh models/*

      # ── 准备后端 extraResources：Go 二进制 + dylib ──────────────
      # sherpa-onnx-go 是 CGO 绑定，必须 CGO_ENABLED=1 原生编译（不交叉编译）
      # x64: 在 Apple Silicon runner 上通过 Rosetta 2 (arch -x86_64) 原生构建 x86_64 进程
      # arm64: 直接在 arm64 进程原生构建
      - name: Build Go server (darwin/${{ matrix.goarch }})
        working-directory: koi-server
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "x64" ]; then
            PREFIX="arch -x86_64"
            echo "x64 构建：通过 Rosetta 2 ($PREFIX) 原生构建，不交叉编译"
          else
            PREFIX=""
            echo "arm64 原生构建"
          fi
          $PREFIX bash -c '
            echo "  -> 进程架构: $(uname -m)"
            echo "  -> go: $(go version)"
            go env GOOS GOARCH CGO_ENABLED
            go mod download
            go build -trimpath -ldflags "-s -w" -o koi-server .
            file koi-server
          '

      # sherpa-onnx 动态库需随二进制打包；rpath 为 @executable_path/../lib
      - name: Copy sherpa-onnx dylibs
        working-directory: koi-server
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "x64" ]; then
            PREFIX="arch -x86_64"
          else
            PREFIX=""
          fi
          MODULE_DIR=$($PREFIX go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-macos)
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            ARCH_DIR="aarch64-apple-darwin"
          else
            ARCH_DIR="x86_64-apple-darwin"
          fi
          mkdir -p lib
          cp -v "${MODULE_DIR}/lib/${ARCH_DIR}/"*.dylib lib/
          echo "lib/ 目录内容："
          ls -lh lib/

      # ── 准备后端 extraResources：.env ────────────────────────────
      # 从 .env.example 复制并改为生产配置；afterPack 会再把端口改写为 5168
      - name: Copy .env.example -> .env for packaging
        working-directory: koi-server
        run: |
          set -e
          cp .env.example .env
          # 生成随机密钥
          APP_KEY=$(openssl rand -base64 32)
          JWT_SECRET=$(openssl rand -base64 32)
          # 改为生产环境并替换密钥
          sed -i.bak \
            -e 's/^APP_ENV=.*/APP_ENV=production/' \
            -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' \
            -e 's/^LOG_LEVEL=.*/LOG_LEVEL=info/' \
            -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" \
            -e 's|^APP_URL=.*|APP_URL=http://localhost:5168|' \
            -e 's|^APP_PORT=.*|APP_PORT=5168|' \
            .env
          rm -f .env.bak
          echo ".env 生成完毕："
          head -20 .env

      # ── 校验 extraResources 五要素齐全 ──────────────────────────
      - name: Verify extraResources
        working-directory: koi-server
        run: |
          test -f koi-server   || { echo "::error::Go 二进制 koi-server 不存在"; exit 1; }
          test -f .env         || { echo "::error::.env 不存在"; exit 1; }
          test -d resources    || { echo "::error::resources 目录不存在"; exit 1; }
          test -d models       || { echo "::error::models 目录不存在"; exit 1; }
          test -d lib          || { echo "::error::lib 目录不存在"; exit 1; }
          echo "extraResources 校验通过"

      # ── 构建 UI + 打包 Electron ─────────────────────────────────
      # 删除 .npmrc 与 package-lock.json，用官方源干净重装依赖
      - name: Prepare UI and install dependencies
        working-directory: koi-ui
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          set -e
          rm -f .npmrc
          rm -f package-lock.json
          rm -rf node_modules
          echo "=== .npmrc 和 package-lock.json 已删除，开始安装依赖 ==="
          npm install
          echo "=== 依赖安装完成 ==="

      - name: Build frontend (rsbuild)
        working-directory: koi-ui
        run: npx rsbuild build

      - name: Package Electron app (${{ matrix.arch }})
        working-directory: koi-ui
        env:
          # 关闭代码签名自动发现，避免无证书环境下构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder -c electron-builder.config.mjs --${{ matrix.arch }}

      - name: Show build output
        working-directory: koi-ui/build-electron
        run: ls -lh *.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koi-ui-macos-${{ matrix.arch }}
          path: koi-ui/build-electron/*.pkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect pkg files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.pkg' -exec cp {} release-assets/ \;
          echo "待发布产物："
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.pkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
